# Shared public gateway (gateway.noveum.ai).
#
# ⚠ DO NOT add NOVEUM_API_KEY / NOVEUM_GUARD_PROJECT_ID to this Deployment.
#
# Those two variables select DEDICATED mode, in which NOVEUM_GUARD_PROJECT_ID is
# process-wide: every request a replica serves would be metered and capped
# against that one project no matter which tenant sent it. This deployment is
# multi-tenant, so dedicated mode would mis-bill every tenant but one.
#
# The mode this deployment needs is SHARED:
#
#   NOVEUM_GUARD_TENANCY=shared      # and NEITHER of the two variables above
#   NOVEUM_API_URL=https://api.noveum.ai
#
# In shared mode every /v1/* caller authenticates with its own Noveum API key in
# the `x-noveum-api-key` header, and the project + organization to enforce
# against are derived server-side from that credential. There is deliberately no
# process-wide key: each caller's own key is used for its own platform calls, so
# one tenant's secret is never applied to another's traffic. That key needs
# `projects:read` (to derive the project), `guardrails:read` (policies + live
# state) and `guardrails:ingest` (usage + reservation settlement).
#
# `/health` stays reachable without a credential, so the liveness probe below
# needs no change.
#
# Before turning it on here, two things must hold:
#
#   1. The platform's composite /state (the nested `org` block) is deployed.
#      The order is mandatory: platform first, then the gateway. Reversed,
#      org-scoped counters read as unavailable and fail-closed org policies
#      block during the rollout.
#   2. You accept that with an HPA up to 50 replicas, a cost cap in ADVISORY
#      enforcement is a per-process estimate, not a cross-replica hard cap.
#      Set NOVEUM_GUARD_COST_ENFORCEMENT=strict for platform-atomic admission,
#      which does hold across replicas.
#
# See "Platform-managed Nova Guard: the two deployment modes" in the README.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: noveum-gateway-ingress
  namespace: noveum
  annotations:
    cert-manager.io/issuer: prod-issuer
    cert-manager.io/issuer-kind: OriginIssuer
    cert-manager.io/issuer-group: cert-manager.k8s.cloudflare.com
    external-dns.alpha.kubernetes.io/hostname: gateway.noveum.ai
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'true'
    nginx.ingress.kubernetes.io/use-proxy-protocol: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: gateway.noveum.ai
      http:
        paths:
          - backend:
              service:
                name: noveum-ai-gateway-svc
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - gateway.noveum.ai
      secretName: noveum-tls-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: noveum-ai-gateway-svc
  namespace: noveum
spec:
  selector:
    app: noveum-ai-gateway
  type: ClusterIP
  ports:
    - port: 80
      name: http
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noveum-ai-gateway
  namespace: noveum
  labels:
    app: noveum-ai-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: noveum-ai-gateway
  strategy:
    rollingUpdate:
      maxSurge: 10%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: noveum-ai-gateway
    spec:
      containers:
        - name: noveum-ai-gateway
          image: noveum/noveum-ai-gateway:latest
          env:
            - name: RUST_LOG
              value: "info"
            - name: ENABLE_ELASTICSEARCH
              value: "true"
            - name: ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: noveum-elasticsearch-credentials
                  key: elasticsearch-url
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: noveum-elasticsearch-credentials
                  key: elasticsearch-username
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: noveum-elasticsearch-credentials
                  key: elasticsearch-password
            - name: ELASTICSEARCH_INDEX
              valueFrom:
                secretKeyRef:
                  name: noveum-elasticsearch-credentials
                  key: elasticsearch-index
          ports:
            - containerPort: 3000
              name: http
          imagePullPolicy: Always
          resources:
            requests:
              memory: '512Mi'
              cpu: '512m'
            limits:
              memory: '1024Mi'
              cpu: '1024m'
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: noveum-ai-gateway
  namespace: noveum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: noveum-ai-gateway
  minReplicas: 1
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
