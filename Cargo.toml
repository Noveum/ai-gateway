[package]
name = "noveum-ai-gateway"
version = "2.0.0"
edition = "2021"
rust-version = "1.94.1"
description = "A high-performance AI Gateway proxy for routing requests to various AI providers, offering seamless integration and management of multiple AI providers."
authors = ["Noveum Team <team@noveum.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://noveum.ai"
repository = "https://github.com/Noveum/ai-gateway"
documentation = "https://docs.rs/noveum-ai-gateway"
readme = "README.md"
keywords = ["ai", "gateway", "proxy", "openai", "llm"]
categories = ["web-programming", "api-bindings", "asynchronous"]
exclude = [
    ".env",
    ".claude/**/*",
    ".cursorrules",
    ".github/**/*",
    ".cargo_vcs_info.json",
    "Cargo.toml.orig",
    "docs/PR30_NOVAGUARD_REVIEW.md",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Cloudflare Worker (worker-build/wasm-pack) build settings. wasm-opt is disabled
# here because it requires a binaryen install on PATH; enable it in CI once
# binaryen is available to shrink the bundle further.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# MUST stay "debuginfo" — do NOT change back to `true`/"symbols".
#
# `strip = true` means `strip = "symbols"`, which on wasm32 tells wasm-ld to drop
# *every* custom section, including `target_features`. That section is not debug
# info: it is the record of which WebAssembly proposals the module was compiled
# with. wasm-bindgen reads it (`Bindgen::update_config`) and only enables its
# externref transform when it sees `reference-types` there. With the section
# stripped, wasm-bindgen silently leaves externref off, never creates the
# externref table, and then `worker-build --release` — which passes
# `--force-enable-abort-handler` so Rust panics surface as JS errors instead of
# killing the isolate — dies with:
#     error: failed to generate catch wrappers
#     Caused by: externref table required for catch wrappers
#
# "debuginfo" strips DWARF only, so `target_features` survives and the Worker
# build keeps panic recovery. The native side loses nothing that ships: `debug`
# is already false, and the Dockerfile runs `strip` on the binary itself, so the
# released image is byte-for-byte as small as before.
strip = "debuginfo"
debug = false

# One package, three deployment shapes:
#   * native binary / Docker  → `cargo build` (default, x86_64/arm64)
#   * Rust library            → `noveum-ai-gateway` as a dependency (rlib)
#   * Cloudflare Worker (edge)→ `cargo build --target wasm32-unknown-unknown` (cdylib)
# The Nova Guard engine + pricing + policy types in `[dependencies]` compile to
# BOTH targets; runtime-specific deps are split by target below.
[lib]
crate-type = ["cdylib", "rlib"]

# The native server binary. `required-features = ["native"]` (on by default) keeps
# it OUT of the wasm32 / Cloudflare Worker build, which is compiled with
# `--no-default-features` (the Worker entry point is the cdylib lib, not a bin).
[[bin]]
name = "noveum-ai-gateway"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
# Marker feature gating the native binary; native runtime deps are selected by
# target (`cfg(not(target_arch = "wasm32"))`), not by this feature.
native = []

# --- Shared core: compiles on native AND wasm32 (Nova Guard, pricing, types) ---
[dependencies]
http = "1.0"
bytes = { version = "1.5.0", features = ["serde"] }
futures = "0.3"
futures-util = { version = "0.3", features = ["io"] }
once_cell = "1.18"
thiserror = "2.0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", features = ["attributes"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.15.1", features = ["serde", "v4"] }
regex = "1.12"                 # linear-time, ReDoS-safe matching (RegexSet, size limits)
aho-corasick = "1.1"           # fast multi-pattern banned-substring matching
sha2 = "0.10"                  # pure-Rust SHA-256 for AWS SigV4 (edge Bedrock); wasm-safe
hmac = "0.12"                  # pure-Rust HMAC-SHA256 for the SigV4 signing-key chain
jsonschema = { version = "0.46", default-features = false }  # JSON Schema validation (no http/file $ref resolvers — wasm-safe)
arc-swap = "1.7"               # lock-free read-mostly policy cache

# --- Native only: the Tokio/Axum server (Docker, binary, library server) ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.7", features = ["http2", "tokio"] }
tokio = { version = "1.0", features = ["full", "parking_lot", "rt-multi-thread"] }
tokio-stream = "0.1"
hyper = { version = "0.14", features = ["client", "runtime"] }
tower-http = { version = "0.6.2", features = ["cors", "compression-full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12.9", features = ["stream", "json", "rustls-tls", "http2", "gzip", "brotli"], default-features = false }
dotenv = "0.15"
async-trait = "0.1"
num_cpus = "1.15"
aws-sigv4 = "1.2.5"
aws-credential-types = "1.2.1"
aws_event_stream_parser = "0.1.2"
parking_lot = "0.12"
colored = "2.1.0"
tiktoken-rs = "0.12"           # token counting (native); wasm uses a char heuristic
async-stream = "0.3"           # SSE tee for post-call streaming policy evaluation

# --- Cloudflare Worker only: WASM runtime + edge fetch ---
#
# The Worker's platform bridge (`policy::worker_remote`: effective-policy fetch,
# live state, admission, settlement) adds NO dependency of its own. It is built
# entirely from `worker::Fetch` + `worker::Delay` below and the shared
# `futures`/`futures-util`/`serde_json`/`uuid` already in [dependencies].
# `reqwest` and Tokio stay strictly native — nothing in the wasm32 graph may
# reach them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", features = ["http"] }
uuid = { version = "1.15.1", features = ["js"] }   # v4 randomness on wasm

[dev-dependencies]
noveum-ai-gateway = { path = "." }
uuid = { version = "1.15.1", features = ["serde", "v4"] }
dotenv = "0.15"
tokio = { version = "1.0", features = ["full", "test-util"] }
reqwest = { version = "0.12.9", features = ["stream", "json", "rustls-tls", "http2", "gzip", "brotli"], default-features = false }
serde_json = "1.0"
tower = { version = "0.5", features = ["util"] }   # ServiceExt::oneshot for router tests
http-body-util = "0.1"                              # BodyExt::collect for response-body assertions
wiremock = "0.6"                                    # mock Noveum platform API for NovaGuard integration tests
axum = "0.7"                                        # build a test router around the guard middleware

[[test]]
name = "run_integration_tests"
path = "tests/run_integration_tests.rs"
required-features = []
