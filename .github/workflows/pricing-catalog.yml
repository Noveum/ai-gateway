name: Pricing catalog

# `pricing/catalog.json` is the ONE source of truth for LLM rates. Two artifacts
# are generated from it and committed:
#
#   * this repo's  src/policy/pricing_catalog.rs
#   * the platform's packages/telemetry/src/pricing/generated/{index.ts,catalog.json}
#
# Before the catalog existed the two tables were maintained by hand and drifted:
# the platform's was missing the whole GPT-5.6 family, Claude Sonnet 5 and
# Gemini 3.6, and disagreed with this repo on nine more models, so the same call
# was priced differently depending on which side of the system looked at it.
# This job is what stops that happening again: it regenerates every artifact and
# fails if what is committed differs by a single byte.
#
# It lives in its own workflow rather than as a step in `rust.yml` because it is
# the only job that needs BOTH repos checked out. The Rust half is verifiable on
# its own (see `--check` without `--platform-repo`); the TypeScript half is
# additionally re-verified inside the platform repo by its own drift test, which
# needs nothing from here.

on:
  push:
    branches: [ "main" ]
    paths:
      - "pricing/**"
      - "scripts/gen_pricing.py"
      - "src/policy/pricing_catalog.rs"
      - ".github/workflows/pricing-catalog.yml"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricing-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Generated pricing artifacts match the catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `--check` renders the Rust artifact through rustfmt before diffing, so
      # the toolchain has to be present or the comparison would be against
      # unformatted text.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # The platform repo is a private sibling; without a token the job still
      # verifies the Rust artifact, which is the half this repo owns. The
      # TypeScript half is gated by the platform's own drift test either way, so
      # a missing token degrades coverage rather than silently passing both.
      - name: Check out the platform repo
        id: platform
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: noveum/noveum-app-nextjs
          path: .platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}

      - name: Regenerate and diff
        run: |
          if [ -d .platform ]; then
            python3 scripts/gen_pricing.py --check --platform-repo .platform
          else
            echo "::warning::platform repo unavailable; verifying the Rust artifact only"
            python3 scripts/gen_pricing.py --check
          fi
