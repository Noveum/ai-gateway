name: Rust

# The PR gate. Every check here is hermetic: no provider API keys, no network
# calls to real LLM providers, no Noveum platform credentials. That is the whole
# point — a green tick on this workflow has to mean the tests actually ran, so
# reviewers can use it as evidence. Real-provider smoke tests live in
# `provider-smoke.yml` (scheduled/manual) so a stale fixture or an expired key
# can never make this gate flaky.

on:
  push:
    branches: [ "main" ]
  # Stacked PRs target the branch below them, not `main`. Without listing those
  # bases here the gate silently does not run on them at all: the PR shows only
  # the Docker check and looks green while nothing has been compiled or tested.
  pull_request:
    branches:
      - "main"
      - "feat/novaguard-platform-bridge"

env:
  CARGO_TERM_COLOR: always
  # Pinned so a new upstream release can't change what the gate builds.
  WORKER_BUILD_VERSION: "0.8.5"
  WRANGLER_VERSION: "4.120.0"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  native:
    name: Format, lint, test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # src/worker_rt.rs is cfg(target_arch = "wasm32"), so the native run above
      # never compiles it. Without this step the crate-level
      # deny(clippy::unwrap_used, clippy::expect_used) does not reach the Worker
      # runtime at all.
      - name: Clippy on the Worker target
        run: cargo clippy --target wasm32-unknown-unknown --lib --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      # Run the hermetic suites by name rather than `cargo test`, which would
      # also pull in `run_integration_tests` (that one needs live provider keys
      # and belongs in the scheduled smoke workflow).
      - name: Unit tests
        run: cargo test --lib

      - name: Nova Guard platform integration tests
        run: cargo test --test novaguard_platform

      - name: Policy middleware integration tests
        run: cargo test --test policy_integration

      - name: Reject whitespace errors in the diff
        run: git diff --check

  supply-chain:
    name: Supply chain (advisories, licences, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: supply-chain

      # NOV-102: the Dockerfile does `COPY Cargo.toml Cargo.lock ./`, so an
      # untracked lockfile makes `docker build` fail on a fresh clone. Both
      # tools below also read Cargo.lock, so if it ever stops being committed
      # they would be auditing a tree resolved on the fly rather than the one
      # we ship. `--locked` additionally fails if the lockfile is stale
      # relative to Cargo.toml.
      - name: Cargo.lock is committed and current
        run: |
          git ls-files --error-unmatch Cargo.lock
          cargo metadata --locked --format-version 1 > /dev/null

      # Versions are pinned (see env above) so a new release of either tool
      # cannot turn the gate red — or, worse, quietly green — on its own.
      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked
          cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked

      # `--deny warnings` is what stops this from silently passing: cargo-audit
      # exits 0 on unmaintained/unsound findings by default. The two `--ignore`
      # IDs are the waivers documented in deny.toml — deny.toml is the source of
      # truth for *why* they are waived, and the two lists must stay in sync.
      # Any advisory that is not one of those two fails the job.
      - name: cargo audit
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2021-0141 \
            --ignore RUSTSEC-2023-0086

      # All four checks run explicitly rather than relying on defaults, so
      # dropping one has to be a visible edit to this file.
      - name: cargo deny
        run: cargo deny check advisories licenses bans sources

  worker:
    name: Build and dry-run the Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with the WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: worker

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install worker-build
        run: cargo install worker-build --version "${WORKER_BUILD_VERSION}" --locked

      # Compiles the crate for wasm32 and generates the JS shim. This is what
      # catches a change that builds natively but breaks the edge target (a
      # `tokio`/`reqwest` import leaking into shared code, say).
      #
      # Plain `--release`, deliberately: worker-build passes
      # `--force-enable-abort-handler` on this path so a Rust panic comes back
      # as a JS error instead of killing the isolate. Do NOT "fix" a failure
      # here by adding `--no-panic-recovery` — that makes the build go green by
      # throwing panic recovery away. The usual cause is [profile.release]
      # `strip` being set back to `true`, which drops the `target_features`
      # custom section that wasm-bindgen needs to enable externref. See the
      # comment on `strip` in Cargo.toml.
      - name: worker-build --release
        run: worker-build --release

      # The failure above is loud, but the *regression* this guards against is
      # silent: if panic recovery is ever quietly disabled, the Worker still
      # builds and still deploys — it just starts tearing down the isolate on
      # any panic instead of returning an error. Assert the machinery is really
      # in the artifact rather than trusting that the build command is intact.
      - name: Assert the Worker bundle kept panic recovery
        run: |
          set -euo pipefail
          fail=0
          # Custom section wasm-bindgen reads to decide whether externref is on.
          for sym in target_features __externref_table_alloc __wbindgen_exn_store; do
            if ! grep -qa "$sym" build/index_bg.wasm; then
              echo "::error::missing '$sym' in build/index_bg.wasm — panic recovery is not wired up"
              fail=1
            fi
          done
          # JS glue side of the catch wrappers.
          for sym in JSTag abort_handler; do
            if ! grep -qa "$sym" build/index.js; then
              echo "::error::missing '$sym' in build/index.js — panic recovery is not wired up"
              fail=1
            fi
          done
          exit "$fail"

      # Validates wrangler.toml and the generated bundle without publishing.
      - name: wrangler deploy --dry-run
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --dry-run
