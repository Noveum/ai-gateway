name: Provider smoke tests

# Real calls to real LLM providers. Deliberately NOT part of the PR gate: these
# need live API keys and depend on provider availability and response shapes, so
# a failure here means "a provider or a key changed", not "this PR is broken".
# Keeping them out of `rust.yml` is what lets the PR gate stay trustworthy.
#
# Run manually from the Actions tab, or on the nightly schedule below.

on:
  workflow_dispatch:
  schedule:
    # 04:00 UTC daily.
    - cron: "0 4 * * *"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  smoke:
    name: Live provider integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build gateway
        run: cargo build --locked --bin noveum-ai-gateway

      - name: Start gateway and run provider integration tests
        shell: bash
        run: |
          set -Eeuo pipefail

          gateway_log="${RUNNER_TEMP}/noveum-ai-gateway.log"
          ./target/debug/noveum-ai-gateway >"${gateway_log}" 2>&1 &
          gateway_pid=$!

          cleanup() {
            status=$?
            trap - EXIT
            if kill -0 "${gateway_pid}" 2>/dev/null; then
              kill "${gateway_pid}" 2>/dev/null || true
              wait "${gateway_pid}" 2>/dev/null || true
            fi
            if (( status != 0 )); then
              echo "::group::Gateway log"
              cat "${gateway_log}" || true
              echo "::endgroup::"
            fi
            exit "${status}"
          }
          trap cleanup EXIT

          for attempt in {1..60}; do
            if curl --fail --silent --show-error "${GATEWAY_URL}/health" >/dev/null; then
              break
            fi
            if ! kill -0 "${gateway_pid}" 2>/dev/null; then
              echo "Gateway exited before becoming healthy" >&2
              exit 1
            fi
            if (( attempt == 60 )); then
              echo "Gateway did not become healthy within 60 seconds" >&2
              exit 1
            fi
            sleep 1
          done

          cargo test --locked --test run_integration_tests -- --nocapture --test-threads=1
        env:
          GATEWAY_URL: http://127.0.0.1:3000
          HOST: 127.0.0.1
          PORT: "3000"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
