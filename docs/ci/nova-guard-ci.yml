# Nova Guard CI — hermetic build/lint/test/coverage for the gateway.
#
# To enable: copy this file to .github/workflows/nova-guard.yml and commit it.
# (It is shipped here under docs/ci/ because adding workflow files requires a
# token with the `workflow` OAuth scope; a maintainer with that scope can move
# it into place in one step.)
#
# Unlike the live-provider integration tests (which need API keys + a running
# gateway), everything here runs hermetically — no secrets required — so it can
# gate every PR.

name: Nova Guard CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: build + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --lib --bins -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Unit + policy integration tests (no external services)
        run: cargo test --lib --test policy_integration --verbose

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@d630c3ba8c9bb0648bcefda869fb0d9b98c611d9 # cargo-llvm-cov
      # Coverage is scoped to the new Nova Guard code (the pre-existing provider /
      # proxy / telemetry modules are untested upstream and out of scope for this
      # gate). The new modules sit at ~91% line coverage; the 85% floor leaves
      # headroom. Drop the --ignore-filename-regex to see crate-wide coverage.
      - name: Coverage (Nova Guard modules), enforce threshold
        run: >
          cargo llvm-cov --lib --test policy_integration
          --ignore-filename-regex '(src/main\.rs|src/lib\.rs|src/error\.rs|src/config\.rs|src/handlers\.rs|src/proxy/|src/telemetry/(middleware|metrics|mod|provider_metrics)\.rs|src/telemetry/plugins/|src/providers/(openai|anthropic|bedrock|groq|fireworks|together|utils|mod)\.rs)'
          --fail-under-lines 85
          --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: lcov.info
